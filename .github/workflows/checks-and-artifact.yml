name: Code checks and panel artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec biome check .

      - name: Test appearance and brand color
        run: pnpm test:appearance

  backend-tests:
    name: Backend tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        db: [mysql, mariadb, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mariadb:
        image: mariadb:10.5
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      pgsql:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, pdo, ${{ matrix.db == 'pgsql' && 'pdo_pgsql' || 'pdo_mysql' }}, zip
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.ci .env
          if [ "${{ matrix.db }}" = "pgsql" ]; then
            echo "DB_CONNECTION=pgsql" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_USERNAME=postgres" >> .env
            echo "DB_PASSWORD=postgres" >> .env
          elif [ "${{ matrix.db }}" = "mariadb" ]; then
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=3307" >> .env
          fi

      - name: Run integration and unit tests
        run: php vendor/bin/phpunit --testsuite=Integration,Unit

  translation-tests:
    name: Translation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: bcmath, gd, pdo, pdo_mysql, zip
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run translation tests
        env:
          SKIP_MIGRATIONS: true
        run: php vendor/bin/phpunit --testsuite=Translations

  build-artifact:
    name: Build downloadable panel.tar.gz
    needs: [frontend-checks, backend-tests, translation-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Create panel.tar.gz
        run: |
          tar -czf panel.tar.gz \
            --exclude='*/.*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='CODE_OF_CONDUCT.md' \
            --exclude='CONTRIBUTING.md' \
            * .env.example

      - name: Upload panel.tar.gz
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: panel.tar.gz
          path: panel.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "## Build artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download panel.tar.gz]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
